<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline' {{cssUri}}; script-src 'unsafe-inline' {{jsUri}};" />
  <link rel="stylesheet" href="{{cssUri}}" />
  <title>LOLCC Chat</title>
</head>
<body>
  <header>
    <div class="title">LOLCC <span class="model">{{chatModel}}</span></div>
    <div class="actions">
      <select id="modeSelect" title="Mod">
        <option value="chat">💬 Chat</option>
        <option value="agent">🤖 Agent</option>
      </select>
      <label class="approve-label" title="Read-only tool'lar otomatik onayla">
        <input type="checkbox" id="autoApprove" /> Auto
      </label>
      <button id="cancelBtn" title="İptal" style="display: none;">⏹</button>
      <button id="clearBtn" title="Temizle">🗑</button>
    </div>
  </header>

  <main id="messages"></main>

  <footer>
    <textarea id="input" placeholder="Görev yaz... (Enter gönder, Shift+Enter yeni satır)" rows="2"></textarea>
    <button id="sendBtn">Gönder</button>
  </footer>

  <script src="{{jsUri}}"></script>
</body>
</html>
